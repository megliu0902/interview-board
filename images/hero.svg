<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170">
  <!-- 背景圓點裝飾 -->
  <circle cx="240" cy="30" r="22" fill="#ffffff" opacity=".12"/>
  <circle cx="30" cy="140" r="14" fill="#ffffff" opacity=".12"/>
  <circle cx="262" cy="128" r="6" fill="#f8981d"/>
  <circle cx="18" cy="40" r="4" fill="#ffffff" opacity=".7"/>
  <!-- 橘色弧線（呼應公司 logo） -->
  <path d="M40 150 Q140 100 250 150" fill="none" stroke="#f8981d" stroke-width="5" stroke-linecap="round" opacity=".9"/>

  <!-- 月曆卡片 -->
  <g transform="translate(70 22) rotate(-4)">
    <rect width="120" height="104" rx="14" fill="#ffffff"/>
    <rect width="120" height="28" rx="14" fill="#f8981d"/>
    <rect y="14" width="120" height="14" fill="#f8981d"/>
    <rect x="22" y="-8" width="8" height="18" rx="4" fill="#0b3d7a"/>
    <rect x="90" y="-8" width="8" height="18" rx="4" fill="#0b3d7a"/>
    <g fill="#d6e3f3">
      <rect x="14" y="40" width="18" height="14" rx="4"/><rect x="38" y="40" width="18" height="14" rx="4"/>
      <rect x="62" y="40" width="18" height="14" rx="4"/><rect x="86" y="40" width="18" height="14" rx="4"/>
      <rect x="14" y="60" width="18" height="14" rx="4"/><rect x="62" y="60" width="18" height="14" rx="4"/>
      <rect x="86" y="60" width="18" height="14" rx="4"/>
      <rect x="14" y="80" width="18" height="14" rx="4"/><rect x="38" y="80" width="18" height="14" rx="4"/>
      <rect x="62" y="80" width="18" height="14" rx="4"/>
    </g>
    <rect x="38" y="60" width="18" height="14" rx="4" fill="#006ae0"/>
    <rect x="86" y="80" width="18" height="14" rx="4" fill="#f8981d"/>
  </g>

  <!-- 打勾徽章 -->
  <g transform="translate(182 92)">
    <circle r="22" fill="#2fbf71"/>
    <path d="M-10 0 L-3 8 L11 -8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 對話泡泡 -->
  <g transform="translate(196 20)">
    <path d="M0 10 Q0 0 10 0 H56 Q66 0 66 10 V30 Q66 40 56 40 H22 L10 50 L12 40 H10 Q0 40 0 30 Z" fill="#ffffff"/>
    <circle cx="20" cy="20" r="4" fill="#006ae0"/>
    <circle cx="33" cy="20" r="4" fill="#5aa0f0"/>
    <circle cx="46" cy="20" r="4" fill="#f8981d"/>
  </g>

  <!-- 閃光星星（呼應公司 logo） -->
  <g transform="translate(46 54)" fill="#ffffff">
    <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"/>
  </g>
  <g transform="translate(236 70)" fill="#ffd9a6">
    <path d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z"/>
  </g>
</svg>
